[package]
name = "blam-radiosity"
description = "Classic Halo CE lightmap radiosity, re-solved at any resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
png = "0.17"
# The CPU path: receivers gather in parallel for every shooting batch.
rayon = "1"
# The GPU path (`gpu` feature): the gather and the per-texel direct light as
# wgpu compute shaders, on Vulkan, DX12 or Metal, no CUDA toolkit.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "metal"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[[example]]
name = "gpu_check"
required-features = ["gpu"]
