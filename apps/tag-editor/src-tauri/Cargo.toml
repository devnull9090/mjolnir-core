[package]
name = "mjolnir-tag-editor"
version = "0.10.0"
description = "MJOLNIR Tag Editor — Guerilla-style tag browser for Halo Campaign Evolved"
authors = ["devnull9090"]
edition = "2021"

# Standalone on purpose: the root workspace excludes this package, and this
# table stops cargo from walking further up and adopting whatever workspace
# happens to sit above it — which is what breaks builds inside a git worktree.
[workspace]

[lib]
name = "tag_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `generate_context!()` embeds the built web assets only when this is on; the
# macro reads it as `cfg!(not(feature = "custom-protocol"))`. Without it a
# packaged build starts and shows "asset not found: index.html".
#
# It is on by default so a release build cannot silently ship broken — this CLI
# does not add it for you. `tauri dev` needs it off to load from the Vite dev
# server, which is what the `app:dev` script does. Do not remove.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

blam-defs = { path = "../../../crates/blam-defs" }
blam-tag = { path = "../../../crates/blam-tag" }
blam-hsc = { path = "../../../crates/blam-hsc" }
blam-live = { path = "../../../crates/blam-live" }
blam-pack = { path = "../../../crates/blam-pack" }
mjolnir-sign = { path = "../../../crates/mjolnir-sign" }
ue-asset = { path = "../../../crates/ue-asset" }
ue-iostore = { path = "../../../crates/ue-iostore" }
ue-texture = { path = "../../../crates/ue-texture" }
getrandom = "0.3"
humantime = "2"
base64 = "0.22"
zip = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
ww2ogg = "0.1.0"
lewton = "0.10.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
lewton = "0.10.2"
