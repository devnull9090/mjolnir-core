[package]
name = "mjolnir-tag-editor"
version = "0.1.0"
description = "MJOLNIR Tag Editor — Guerilla-style tag browser for Halo Campaign Evolved"
authors = ["devnull9090"]
edition = "2021"

[lib]
name = "tag_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

blam-defs = { path = "../../../crates/blam-defs" }
blam-tag = { path = "../../../crates/blam-tag" }
ue-iostore = { path = "../../../crates/ue-iostore" }
texture2ddecoder = "0.1"
png = "0.17"
base64 = "0.22"
