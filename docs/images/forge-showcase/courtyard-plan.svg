<text x="54" y="99" font-size="38" fill="#e8f0f4" font-weight="bold" text-anchor="start" >A raised courtyard</text>
<text x="54" y="130" font-size="18" fill="#9bb0bd" font-weight="normal" text-anchor="start" >10 pieces · 16 × 16 m deck · 2 m rise · open sky</text>
