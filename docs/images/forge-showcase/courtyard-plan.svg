<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Build a raised courtyard</title><desc id="desc">Ten real Foundry Wide pieces. A sixteen-metre square deck sits two metres above ground, reached by an eight-metre ramp. Overall footprint sixteen by twenty-four metres. Four-metre planning grid.</desc>
