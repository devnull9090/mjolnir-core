<polygon points="773.000,226.000 768.000,238.000 778.000,238.000" fill="#69d8e5" stroke="#69d8e5" stroke-width="0.7" stroke-linejoin="round" />
<text x="773" y="214" font-size="12" fill="#69d8e5" font-weight="bold" text-anchor="middle" >N / +Y</text>
<text x="850" y="202" font-size="13" fill="#69d8e5" font-weight="bold" text-anchor="start" letter-spacing="1.5">THE TEN PIECES</text>
<text x="850" y="240" font-size="12" fill="#69d8e5" font-weight="bold" text-anchor="start" >01</text>
<text x="880" y="240" font-size="17" fill="#e8f0f4" font-weight="bold" text-anchor="start" >One large floor</text>
<text x="880" y="265" font-size="14" fill="#69d8e5" font-weight="normal" text-anchor="start" >16 × 16 × 0.5 m</text>
<text x="880" y="286" font-size="13" fill="#9bb0bd" font-weight="normal" text-anchor="start" >Underside at +1.5 m</text>
<text x="850" y="331" font-size="12" fill="#e9b969" font-weight="bold" text-anchor="start" >02</text>
<text x="880" y="331" font-size="17" fill="#e8f0f4" font-weight="bold" text-anchor="start" >One broad ramp</text>
<text x="880" y="356" font-size="14" fill="#e9b969" font-weight="normal" text-anchor="start" >8 × 8 m · rise 2 m</text>
<text x="880" y="377" font-size="13" fill="#9bb0bd" font-weight="normal" text-anchor="start" >High edge meets floor top</text>
<text x="850" y="422" font-size="12" fill="#c6d1d6" font-weight="bold" text-anchor="start" >03</text>
<text x="880" y="422" font-size="17" fill="#e8f0f4" font-weight="bold" text-anchor="start" >Six full walls</text>
<text x="880" y="447" font-size="14" fill="#c6d1d6" font-weight="normal" text-anchor="start" >8 × 1 × 3 m each</text>
<text x="880" y="468" font-size="13" fill="#9bb0bd" font-weight="normal" text-anchor="start" >Two on each of three sides</text>
<text x="850" y="513" font-size="12" fill="#e9b969" font-weight="bold" text-anchor="start" >04</text>
<text x="880" y="513" font-size="17" fill="#e8f0f4" font-weight="bold" text-anchor="start" >Two low cover pieces</text>
<text x="880" y="538" font-size="14" fill="#e9b969" font-weight="normal" text-anchor="start" >4 × 1.5 × 1 m each</text>
<text x="880" y="559" font-size="13" fill="#9bb0bd" font-weight="normal" text-anchor="start" >Leave the 8 m entrance clear</text>
<text x="850" y="640" font-size="13" fill="#69d8e5" font-weight="bold" text-anchor="start" letter-spacing="1">KEEP THE JOIN FLUSH</text>
<polygon points="850.000,724.000 950.000,699.000 950.000,724.000" fill="#665232" stroke="#e9b969" stroke-width="0.7" stroke-linejoin="round" />
<rect x="950" y="699" width="180" height="6.25" rx="0" fill="#244b59" stroke="#69d8e5" />
<line x1="840" y1="724" x2="1140" y2="724" stroke="#455863" stroke-width="1" stroke-dasharray="3 4"/>
<text x="850" y="747" font-size="12" fill="#9bb0bd" font-weight="normal" text-anchor="start" >ramp nose 0 m</text>
<text x="1130" y="682" font-size="13" fill="#69d8e5" font-weight="normal" text-anchor="end" >walking surface +2 m</text>
<text x="1130" y="770" font-size="13" fill="#9bb0bd" font-weight="normal" text-anchor="end" >0.5 m slab → underside +1.5 m</text>
<text x="54" y="824" font-size="12" fill="#69d8e5" font-weight="bold" text-anchor="start" letter-spacing="1">PLAN, NOT AN IN-GAME SCREENSHOT</text>
<text x="54" y="851" font-size="16" fill="#9bb0bd" font-weight="normal" text-anchor="start" >4 m grid. All heights measured from ground. Piece origins and dimensions match the building guide.</text>
<text x="54" y="878" font-size="14" fill="#9bb0bd" font-weight="normal" text-anchor="start" >Forge has placement snapping, not automatic edge docking or numeric coordinate entry.</text>
</g></svg>
