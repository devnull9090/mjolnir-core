name: Deploy Hub to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      # The build snapshots these into the site, so editing one changes what
      # deploys even though no file under hub/ moved.
      - 'docs/**'
      - 'defs/hce/tag-definitions.json'
      - '.github/workflows/deploy-hub.yml'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask sensitive values
        run: |
          echo "::add-mask::${{ secrets.ACCOUNT_NAME }}"
          echo "::add-mask::${{ secrets.CLOUDFLARE_URL }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: hub

      - name: Build with OpenNext
        run: pnpm run cf:build
        working-directory: hub
        env:
          NEXT_PUBLIC_GTAG_ID: ${{ secrets.GOOGLE_GTAG }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: hub
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Uploaded to the Worker's secret store, not baked into the bundle.
          secrets: |
            DISCORD_CLIENT_ID
            DISCORD_CLIENT_SECRET
            DISCORD_PUBLIC_KEY
            JWT_SECRET
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}