name: Release Launcher

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Release
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Mask sensitive values
        run: |
          echo "::add-mask::${{ secrets.ACCOUNT_NAME }}"
          echo "::add-mask::${{ secrets.CLOUDFLARE_URL }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: launcher

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: |
            
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "MJOLNIR Launcher ${{ github.ref_name }}"
          releaseBody: "See release notes below for download links and SHA-256 checksums."
          releaseDraft: true
          prerelease: false

      - name: Compute SHA-256 checksums
        id: checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^launcher-v", ""
          $artifactsDir = "launcher/src-tauri/target/release/bundle"

          # Find the MSI and NSIS installers
          $msi = Get-ChildItem -Path "$artifactsDir/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          $nsis = Get-ChildItem -Path "$artifactsDir/nsis" -Filter "*.exe" -Recurse | Select-Object -First 1

          $checksumFile = "checksums-${{ github.ref_name }}.txt"
          "# MJOLNIR Launcher ${{ github.ref_name }} - SHA-256 Checksums" | Out-File $checksumFile
          "" | Out-File $checksumFile -Append

          if ($msi) {
            $msiHash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
            "$msiHash  $($msi.Name)" | Out-File $checksumFile -Append
            echo "msi_hash=$msiHash" >> $env:GITHUB_OUTPUT
            echo "msi_name=$($msi.Name)" >> $env:GITHUB_OUTPUT
            echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "MSI: $msiHash  $($msi.Name)"
          }

          if ($nsis) {
            $nsisHash = (Get-FileHash $nsis.FullName -Algorithm SHA256).Hash.ToLower()
            "$nsisHash  $($nsis.Name)" | Out-File $checksumFile -Append
            echo "nsis_hash=$nsisHash" >> $env:GITHUB_OUTPUT
            echo "nsis_name=$($nsis.Name)" >> $env:GITHUB_OUTPUT
            echo "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "NSIS: $nsisHash  $($nsis.Name)"
          }

          echo "checksum_file=$checksumFile" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Get-Content $checksumFile

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: checksums-${{ github.ref_name }}.txt
          body: |
            ## MJOLNIR Launcher ${{ github.ref_name }}

            Download the MJOLNIR Launcher for Windows.

            ### Downloads
            | Installer | SHA-256 |
            | :--- | :--- |
            | ${{ steps.checksums.outputs.msi_name }} | `${{ steps.checksums.outputs.msi_hash }}` |
            | ${{ steps.checksums.outputs.nsis_name }} | `${{ steps.checksums.outputs.nsis_hash }}` |

            ### Verify your download
            ```powershell
            # PowerShell
            (Get-FileHash .\MJOLNIR-Launcher*.msi -Algorithm SHA256).Hash
            ```
            ```bash
            # Linux/macOS
            sha256sum MJOLNIR-Launcher*.msi
            ```

            Compare the output with the checksums above. They must match exactly.

      - name: Upload to R2 (releases.mjolnircore.com)
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler

          # Upload MSI
          if ("${{ steps.checksums.outputs.msi_path }}" -ne "") {
            wrangler r2 object put "mjolnir-releases/launcher/${{ github.ref_name }}/${{ steps.checksums.outputs.msi_name }}" --file="${{ steps.checksums.outputs.msi_path }}" --remote
            wrangler r2 object put "mjolnir-releases/launcher/latest/${{ steps.checksums.outputs.msi_name }}" --file="${{ steps.checksums.outputs.msi_path }}" --remote
            wrangler r2 object put "mjolnir-releases/launcher/latest/MJOLNIR-Launcher-latest.msi" --file="${{ steps.checksums.outputs.msi_path }}" --remote
          }

          # Upload NSIS
          if ("${{ steps.checksums.outputs.nsis_path }}" -ne "") {
            wrangler r2 object put "mjolnir-releases/launcher/${{ github.ref_name }}/${{ steps.checksums.outputs.nsis_path }}" --file="${{ steps.checksums.outputs.nsis_path }}" --remote
            wrangler r2 object put "mjolnir-releases/launcher/latest/${{ steps.checksums.outputs.nsis_path }}" --file="${{ steps.checksums.outputs.nsis_path }}" --remote
            wrangler r2 object put "mjolnir-releases/launcher/latest/MJOLNIR-Launcher-latest-setup.exe" --file="${{ steps.checksums.outputs.nsis_path }}" --remote
          }

          # Upload checksums
          wrangler r2 object put "mjolnir-releases/launcher/${{ github.ref_name }}/checksums.txt" --file="checksums-${{ github.ref_name }}.txt" --remote
          wrangler r2 object put "mjolnir-releases/launcher/latest/checksums.txt" --file="checksums-${{ github.ref_name }}.txt" --remote

          Write-Host "✅ Uploaded to releases.mjolnircore.com"

      - name: Post release notification to Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VER: ${{ steps.checksums.outputs.version }}
          MSI_HASH: ${{ steps.checksums.outputs.msi_hash }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            Write-Host "ℹ️ DISCORD_RELEASE_WEBHOOK_URL secret not set. Skipping Discord notification."
            exit 0
          }
          echo "::add-mask::$env:DISCORD_WEBHOOK_URL"
          $tag = $env:RELEASE_TAG
          $ver = $env:RELEASE_VER
          $hash = $env:MSI_HASH

          $embedObj = @{
            username = "MJOLNIR Core Releases"
            avatar_url = "https://mjolnircore.com/logo-transparent.png"
            embeds = @(
              @{
                title = "🚀 MJOLNIR Launcher $tag Released!"
                url = "https://mjolnircore.com/download"
                description = "A new build of the MJOLNIR Core Launcher for Halo Campaign Evolved is now available!"
                color = 13936707
                thumbnail = @{
                  url = "https://mjolnircore.com/logo-transparent.png"
                }
                fields = @(
                  @{
                    name = "📦 Version"
                    value = "v$ver"
                    inline = $true
                  },
                  @{
                    name = "🛡️ SHA-256 (MSI)"
                    value = "$hash"
                    inline = $false
                  },
                  @{
                    name = "🔗 Download Options"
                    value = "• [Download Page & Verification](https://mjolnircore.com/download)`n• [GitHub Release](https://github.com/devnull9090/mjolnir-core/releases/tag/$tag)`n• [Direct CDN (.msi)](https://releases.mjolnircore.com/launcher/latest/MJOLNIR-Launcher-latest.msi)"
                    inline = $false
                  }
                )
                footer = @{
                  text = "MJOLNIR Core · Halo Campaign Evolved Modding Platform"
                }
              }
            )
          }

          $bodyJson = $embedObj | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType 'application/json' -Body ([System.Text.Encoding]::UTF8.GetBytes($bodyJson))
          Write-Host "✅ Posted release notification to Discord"
