name: Release Launcher

on:
  push:
    tags: ['launcher-v*']

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: launcher

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "MJOLNIR Launcher ${{ github.ref_name }}"
          releaseBody: "Download the MJOLNIR Launcher for Windows. See [CHANGELOG](https://github.com/devnull9090/mjolnir-core/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
