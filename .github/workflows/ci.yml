name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-mods:
    name: Lint Lua Mods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luarocks > /dev/null 2>&1
          sudo luarocks install luacheck > /dev/null 2>&1 || true

      - name: Lint Lua scripts
        run: |
          if command -v luacheck &> /dev/null; then
            luacheck mods/ signatures/ \
              --no-unused-args \
              --no-max-line-length \
              --std luajit+lua52 \
              --globals RegisterHook RegisterKeyBindAsync RegisterKeyBind \
                        RegisterConsoleCommandHandler IsKeyBindRegistered \
                        ExecuteInGameThread ExecuteInGameThreadWithDelay \
                        FindFirstOf FindAllOf StaticFindObject StaticConstructObject \
                        FName FText Key ModifierKey NotifyOnNewObject \
                        LoopAsync ExecuteAsync CreateInvalidationContext \
                        LoadAsset ForEachUObject IterateGameDirectories \
                        UEHelpers \
              --ignore 111 112 113 114 131 212 \
              || true
          else
            echo "⚠️ luacheck not available, skipping lint"
          fi

  validate-structure:
    name: Validate Repo Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking repo structure..."
          test -f config/UE4SS-settings.ini || (echo "FAIL: config/UE4SS-settings.ini missing" && exit 1)
          test -d mods/MJOLNIRCore || (echo "FAIL: mods/MJOLNIRCore missing" && exit 1)
          test -d signatures || (echo "FAIL: signatures/ missing" && exit 1)
          test -f LICENSE || (echo "FAIL: LICENSE missing" && exit 1)
          echo "✅ All checks passed."

      - name: Ensure no secrets in repo
        run: |
          echo "Scanning for potential secrets..."
          # Grep for hardcoded secret values. References to the *names* are
          # fine: env accessors (process.env / c.env), binding type
          # declarations, and workflow files.
          if grep -rn "CLOUDFLARE_API_TOKEN\|DISCORD_CLIENT_SECRET\|JWT_SECRET" \
            --include="*.ts" --include="*.js" --include="*.json" --include="*.toml" \
            . | grep -v ".example" | grep -v "secrets\." | grep -v "process.env" \
              | grep -v "env\." | grep -v "?: string" | grep -v "\.github" | grep -v "node_modules"; then
            echo "⚠️ WARNING: Possible hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No secrets found."

  hub:
    name: Hub (lint, types, generated-artifact drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: hub

      - name: Lint
        run: pnpm lint
        working-directory: hub

      - name: Typecheck
        run: pnpm typecheck
        working-directory: hub

      # The committed spec must match what the code generates; a mismatch
      # means someone changed the API without re-running openapi:export.
      - name: OpenAPI drift check
        run: pnpm openapi:check
        working-directory: hub

      # docs/ and defs/ are snapshotted into src/generated by `pnpm sync`. The
      # build re-runs sync, so a stale snapshot compiles and deploys fine and
      # the only symptom is a page missing a section — which is how the tag
      # editing guide lost Part 3 for a day.
      - name: Generated docs and tag artifact drift check
        run: pnpm sync:check
        working-directory: hub
