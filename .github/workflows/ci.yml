name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every job only reads the repository (artifact upload uses its own runtime
# token, not GITHUB_TOKEN); keep the token to that.
permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. A run
# on main is never cancelled once it has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The two required checks (Lint Lua Mods, Validate Repo Structure) run on
# every pull request; they take a minute or two. Build native and Hub run
# only when their inputs change (see .github/scripts/changed-areas.sh), and
# also whenever this file or that script changes, or detection fails.
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.areas.outputs.native }}
      hub: ${{ steps.areas.outputs.hub }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SELF: .github/workflows/ci.yml
        run: bash .github/scripts/changed-areas.sh

  lint-mods:
    name: Lint Lua Mods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luarocks lua5.4 > /dev/null 2>&1
          sudo luarocks install luacheck > /dev/null 2>&1 || true

      - name: Test multiplayer HUD and team presentation
        run: |
          lua5.4 tools/tests/test_multiplayer_ui.lua
          lua5.4 tools/tests/test_flycam_shots.lua
          lua5.4 tools/tests/test_lobby_startup.lua
          lua5.4 tools/tests/test_hill_marker.lua
          lua5.4 tools/tests/test_flag_marker.lua
          lua5.4 tools/tests/test_markers_players.lua
          lua5.4 tools/tests/test_roster.lua
          lua5.4 tools/tests/test_match_report.lua
          lua5.4 tools/tests/test_bipeds.lua
          lua5.4 tools/tests/test_bots_scan.lua
          lua5.4 tools/tests/test_waypoint.lua

      - name: Test the lobby after a match (Quit, missing worlds, a joiner told why)
        run: |
          lua5.4 tools/tests/test_lobby_postgame.lua
          lua5.4 tools/tests/test_postgame_view.lua
          lua5.4 tools/tests/test_map_worlds.lua

      - name: Test host-to-client messages (controller walks only when players change)
        run: lua5.4 tools/tests/test_lobby_net.lua

      - name: Test UI class retention across map travel
        run: lua5.4 tools/tests/test_ui_class_lifetime.lua

      - name: Test the game type picker
        run: lua5.4 tools/tests/test_gametype_picker.lua

      - name: Test the game variants against every table keyed by them
        run: lua5.4 tools/tests/test_game_variants.lua

      - name: Test Discord presence and public-session joins
        run: lua5.4 tools/tests/test_discord_presence.lua

      - name: Test kill floors
        run: lua5.4 tools/tests/test_kill_floor.lua

      - name: Test Halo 2 and Forge pack lifts
        run: |
          lua5.4 tools/tests/test_lifts.lua
          lua5.4 tools/tests/test_pack_lifts.lua
          lua5.4 tools/tests/test_lifts_runtime.lua

      - name: Test a CE map's device helpers
        run: lua5.4 tools/tests/test_devices.lua

      - name: Test a map's load spread over frames, and its level file decoded once
        run: |
          lua5.4 tools/tests/test_dress.lua
          lua5.4 tools/tests/test_level_files.lua

      - name: Test a converted vehicle's sound helpers
        run: |
          lua5.4 tools/tests/test_vehicle_sounds.lua
          lua5.4 tools/tests/test_vehicle_sounds_runtime.lua

      - name: Test the FIRETEAM panel past four players
        run: lua5.4 tools/tests/test_squadpanel.lua

      - name: Test the out-of-date prompt at the main menu
        run: lua5.4 tools/tests/test_outdated.lua

      - name: Test host game settings against the variant writer
        run: |
          lua5.4 tools/tests/test_variant_settings.lua
          lua5.4 tools/tests/test_game_settings.lua
          lua5.4 tools/tests/test_vehicle_sets.lua

      - name: Test team colours (CTF flags and team armour)
        run: lua5.4 tools/tests/test_teams.lua

      - name: Test Forge labels, controls, dispatch, lights and materials
        run: |
          lua5.4 tools/tests/test_forge_pack_labels.lua
          lua5.4 tools/tests/test_forge_controls.lua
          lua5.4 tools/tests/test_forge_dispatch.lua
          lua5.4 tools/tests/test_forge_lights.lua
          lua5.4 tools/tests/test_forge_materials.lua

      - name: Test the bot (routes, steering, decisions, the simulation reader) and the in-game input script
        run: node --test tools/bot/test_brain.mjs tools/bot/test_steer.mjs tools/bot/test_navmesh.mjs tools/mcp/game/test_in_game_input.mjs

      - name: Lint Lua scripts
        run: |
          if command -v luacheck &> /dev/null; then
            luacheck mods/ signatures/ \
              --no-unused-args \
              --no-max-line-length \
              --std luajit+lua52 \
              --globals RegisterHook RegisterKeyBindAsync RegisterKeyBind \
                        RegisterConsoleCommandHandler IsKeyBindRegistered \
                        ExecuteInGameThread ExecuteInGameThreadWithDelay \
                        FindFirstOf FindAllOf StaticFindObject StaticConstructObject \
                        FName FText Key ModifierKey NotifyOnNewObject \
                        LoopAsync ExecuteAsync CreateInvalidationContext \
                        LoadAsset ForEachUObject IterateGameDirectories \
                        UEHelpers \
              --ignore 111 112 113 114 131 212 \
              || true
          else
            echo "⚠️ luacheck not available, skipping lint"
          fi

  # Six mods have a native half (native/blam_console, native/map_registry,
  # native/lobby, native/frame_times, native/forge, native/flycam),
  # built on every pull request that changes native/ or the crates the map
  # registry links (mjolnir-mglo-cabi), so a change that does not compile is
  # caught here and not at the release gate. The artifacts are what a reviewer
  # installs to test; a PR that skips this job leaves the DLLs as released.
  # The release workflow builds its own from the tag.
  build-native:
    name: Build native (Blam console + map registry + lobby + frame times + forge + flycam DLLs)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build mjolnir_blam_console.dll
        shell: pwsh
        run: .\native\blam_console\build.ps1

      - name: Build mjolnir_map_registry.dll
        shell: pwsh
        run: .\native\map_registry\build.ps1

      - name: Build mjolnir_lobby.dll
        shell: pwsh
        run: .\native\lobby\build.ps1

      - name: Test Discord RPC with an isolated named pipe
        shell: pwsh
        run: .\native\lobby\test-discord.ps1

      - name: Test automatic Forge door contract and motion
        shell: pwsh
        run: .\native\lobby\test-forge-doors.ps1

      - name: Test Halo 2 lift files and pushes
        shell: pwsh
        run: .\native\lobby\test-lifts.ps1

      - name: Test the Lua channel against a stand-in for UE4SS's LuaMadeSimple
        shell: pwsh
        run: .\native\lobby\test-lua-channel.ps1

      - name: Test the players' roster (its table reads and packed form)
        shell: pwsh
        run: .\native\lobby\test-roster.ps1

      - name: Test the medals (catalogue, what hides what, their order)
        shell: pwsh
        run: .\native\lobby\test-medals.ps1

      - name: Build mjolnir_frame_times.dll
        shell: pwsh
        run: .\native\frame_times\build.ps1

      - name: Build mjolnir_forge.dll
        shell: pwsh
        run: .\native\forge\build.ps1

      - name: Test Forge pack bindings
        shell: pwsh
        run: .\native\forge\test-pack-bindings.ps1

      - name: Build mjolnir_flycam.dll
        shell: pwsh
        run: .\native\flycam\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mjolnir_blam_console
          path: mods/MJOLNIRBlamConsole/native/mjolnir_blam_console.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mjolnir_map_registry
          path: mods/MJOLNIRLevelLoader/native/mjolnir_map_registry.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mjolnir_lobby
          path: mods/MJOLNIRLobby/native/mjolnir_lobby.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mjolnir_frame_times
          path: mods/MJOLNIRHud/native/mjolnir_frame_times.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mjolnir_forge
          path: mods/MJOLNIRForge/native/mjolnir_forge.dll
          if-no-files-found: error

      - uses: actions/upload-artifact\v4
        with:
          name: mjolnir_flycam
          path: mods/MJOLNIRFlyCam/native/mjolnir_flycam.dll
          if-no-files-found: error

  validate-structure:
    name: Validate Repo Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking repo structure..."
          test -f config/UE4SS-settings.ini || (echo "FAIL: config/UE4SS-settings.ini missing" && exit 1)
          test -d mods/MJOLNIRCore || (echo "FAIL: mods/MJOLNIRCore missing" && exit 1)
          test -d signatures || (echo "FAIL: signatures/ missing" && exit 1)
          test -f LICENSE || (echo "FAIL: LICENSE missing" && exit 1)
          echo "✅ All checks passed."

      # The map generators check for colliding pieces with numpy.
      - name: Test Forge map archive builder
        env:
          # Ubuntu's system Python is externally managed; this runner is throwaway.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          python -m pip install --quiet numpy
          python -m unittest discover -s tools/forge -p test_build_maps.py
          python -m unittest discover -s tools/forge -p test_build_materials.py

      - name: Test the weekly update tool
        run: python -m unittest discover -s tools/weekly -p test_weekly_update.py
      - name: CE script translator tests
        run: python -m unittest discover -s tools/ce_scripts -p test_ce_translate.py
      - name: Custom vehicle physics tests
        run: |
          python -m unittest discover -s tools/level -p "test_ce_vehicle_[pl]*.py"
          python -m unittest discover -s tools/level -p test_ce_place_vehicles.py
      - name: Spawn set tests
        run: python -m unittest discover -s tools/level -p test_spawn_sets.py
      - name: Baked river water pack tests
        run: python -m unittest discover -s tools/level -p test_add_flux_state.py
      - name: Wwise bank tests
        run: python -m unittest discover -s tools/level -p test_wwise_bank.py

      - name: Check Forge packs and maps for colliding and z-fighting pieces
        run: python -m unittest discover -s tools/forge -p test_check_overlaps.py

      - name: Validate original Forge pack geometry and connectors
        run: |
          python forge-packs/foundry/validate.py
          python forge-packs/foundry-wide/validate.py
          python forge-packs/roadworks/validate.py

      - name: Ensure no secrets in repo
        run: |
          echo "Scanning for potential secrets..."
          # Grep for hardcoded secret values. References to the *names* are
          # fine: env accessors (process.env / c.env), binding type
          # declarations, and workflow files.
          if grep -rn "CLOUDFLARE_API_TOKEN\|DISCORD_CLIENT_SECRET\|JWT_SECRET" \
            --include="*.ts" --include="*.js" --include="*.json" --include="*.toml" \
            . | grep -v ".example" | grep -v "secrets\." | grep -v "process.env" \
              | grep -v "env\." | grep -v "?: string" | grep -v "\.github" | grep -v "node_modules"; then
            echo "⚠️ WARNING: Possible hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No secrets found."

  # Runs when hub/ changes or anything its build snapshots does: docs/, defs/,
  # changelog/, blog/, and the tools/fixtures/ its tests read.
  hub:
    name: Hub (lint, types, generated-artifact drift)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.hub == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: hub

      - name: Lint
        run: pnpm lint
        working-directory: hub

      - name: Typecheck
        run: pnpm typecheck
        working-directory: hub

      - name: Test archive scans and API routes
        run: pnpm test
        working-directory: hub

      # Build the worker the way the deploy does and answer one request with
      # it. Lint and types passed on #268, whose Next.js update the OpenNext
      # adapter of the day could not run: every request in production 500'd
      # ("Unexpected loadManifest(/.next/server/preview-props.json) call!")
      # from deploy to rollback. /api/changelog reads only generated JSON, so
      # it needs no database, and that crash came before any route ran.
      - name: Build with OpenNext and serve one request
        working-directory: hub
        run: |
          pnpm run cf:build
          npx wrangler dev --port 8787 --local > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/changelog || true)
            if [ "$code" = "200" ]; then echo "worker answered 200"; exit 0; fi
            sleep 2
          done
          echo "worker never answered 200 (last: $code)"
          tail -60 wrangler-dev.log
          exit 1

      # The committed spec must match what the code generates; a mismatch
      # means someone changed the API without re-running openapi:export.
      - name: OpenAPI drift check
        run: pnpm openapi:check
        working-directory: hub

      # docs/, defs/ and changelog/ are snapshotted into src/generated by
      # `pnpm sync`. The build re-runs sync, so a stale snapshot compiles and
      # deploys fine and the only symptom is a page missing a section — which
      # is how the tag editing guide lost Part 3 for a day.
      - name: Generated docs, tag and changelog artifact drift check
        run: pnpm sync:check
        working-directory: hub
