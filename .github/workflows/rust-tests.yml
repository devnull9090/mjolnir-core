# Runs the Rust test suites on pull requests, so a broken test (or a test
# helper that doesn't even compile) is caught before merge instead of on the
# next release run — release-tag-editor.yml was the only thing compiling the
# tag-editor tests until PR #60 merged one that didn't build and broke the
# v0.10.0 release.
#
# Path-filtered so PRs that touch neither the crates nor either desktop app
# skip the workflow entirely. Within it, a `changes` job picks which jobs run
# (.github/scripts/changed-areas.sh): a crate change runs all three, because
# both apps build crates from the workspace, but a launcher-only change runs
# only the launcher job and a tag-editor-only change only the tag editor's.
name: Rust Tests

# Test jobs only ever read the repo; keep the token to that.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/tag-editor/src-tauri/**'
      - 'apps/launcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-tests.yml'
      - '.github/scripts/changed-areas.sh'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/tag-editor/src-tauri/**'
      - 'apps/launcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-tests.yml'
      - '.github/scripts/changed-areas.sh'

# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      tag_editor: ${{ steps.areas.outputs.tag_editor }}
      launcher: ${{ steps.areas.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SELF: .github/workflows/rust-tests.yml
        run: bash .github/scripts/changed-areas.sh

  # Each job also runs when change detection itself failed, so a broken
  # detector shows up as extra work rather than as tests that never ran.
  crates:
    name: Workspace crates (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # Both platforms, because half of blam-live only exists on one of them:
      # `sys.rs` carries a `cfg(windows)` implementation of ~280 lines of Win32
      # and a stub for everything else, so a Linux-only run compiles the stub
      # and never sees the code that actually attaches to the game. That half
      # ships in the CLI release, and the release build should not be the first
      # thing that ever compiles it.
      - name: Test
        run: cargo test --workspace

  tag-editor:
    name: Tag editor
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tag_editor == 'true') }}
    # Windows to match the release build environment; the crate also has
    # cfg(windows) dependencies, and Tauri needs no system packages here,
    # unlike a Linux runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tag-editor/src-tauri -> target

      # Without the default `custom-protocol` feature, `generate_context!()`
      # does not embed `../dist`, so no frontend build is needed. Debug rather
      # than --release keeps the PR loop fast; the release workflow still runs
      # the suite with shipping features before anything is published. The two
      # e2e tests are #[ignore]d (they need an installed game) but still get
      # compiled, which is the failure mode this job exists to catch.
      - name: Test
        run: cargo test --no-default-features
        working-directory: apps/tag-editor/src-tauri

  launcher:
    name: Launcher links, Discord startup and Forge inventory
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.launcher == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - name: Build launcher frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: apps/launcher
      - name: Test link routing and duplicate launch protection
        run: |
          cargo test --lib links::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib discord
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib forge_
        working-directory: apps/launcher/src-tauri
