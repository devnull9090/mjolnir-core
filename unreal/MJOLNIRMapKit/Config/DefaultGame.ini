; MJOLNIR MapKit — packaging settings.
;
; The three load-bearing choices:
;
; 1. bShareMaterialShaderCode=False — shader bytecode is inlined into each
;    material package instead of a shared ShaderArchive-*.ushaderbytecode
;    library. The game only opens ITS OWN shader libraries at boot; a library
;    inside a dropped-in container is never opened, so any material that
;    depends on one renders broken or crashes. Inlined shaders load with the
;    package and need no cooperation from the game.
;
; 2. bUseIoStore=True — the game's zen loader resolves packages through
;    IoStore containers (.utoc/.ucas), not classic pak entries. A plain .pak
;    of cooked assets is invisible to it (verified for tags; see
;    docs/iostore_packaging.md).
;
; 3. Oodle compression — matches the shipped containers. Uncompressed also
;    works (verified), this is just smaller.

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
bCompressed=True
PakFileCompressionFormats=Oodle
bShareMaterialShaderCode=False
bSharedMaterialNativeLibraries=False
; Chunking exists so the installable container holds ONLY the custom world and
; its dependency closure. A PrimaryAssetLabel in /Game/Levels/Test (created by
; mjolnir_build_world.py) assigns chunk 990; engine startup content stays in
; pakchunk0, which is never installed. Without this, the staged container
; carries hundreds of engine packages that would patch-override the game's own
; copies — cooked by 343's modified engine — game-wide.
bGenerateChunks=True
IniKeyDenylist=
+MapsToCook=(FilePath="/Game/Levels/Test/Testing_Shooting_Range/testing_shooting_range")

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=MJOLNIR MapKit (Meteorite)
