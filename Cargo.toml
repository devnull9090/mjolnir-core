[workspace]
resolver = "2"
members = [
    "crates/ue-iostore",
    "crates/ue-texture",
    "crates/ue-asset",
    "crates/blam-defs",
    "crates/blam-tag",
    "crates/blam-hsc",
    "crates/blam-pack",
    "crates/blam-live",
    "crates/mjolnir-sign",
    "crates/blam-cli",
]

# The launcher ships today with its own lockfile and release pipeline. It is kept
# out of this workspace deliberately so the restructure cannot change its build
# output paths. Migrate it separately once the tag editor pipeline is proven.
exclude = ["apps/launcher/src-tauri", "apps/tag-editor/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/devnull9090/mjolnir-core"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
flate2 = "1"
libloading = "0.8"
# Pure-Rust Kraken/Mermaid/Selkie/Leviathan decoder, so reading a container
# needs no proprietary DLL. Verified byte-identical to oo2core_9 over 56k of
# the game's own blocks; the DLL stays supported as a faster override.
#
# Patched below to a fork: see [patch.crates-io].
oozextract = { version = "0.5", default-features = false }
memmap2 = "0.9"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"

# Two of the decoder's bit readers fetch an unaligned 32-bit word that ooz lets
# run past the end of the compressed region; the surplus bits are masked off
# again, so their value is irrelevant but their position is not. Upstream 0.5.5
# clamps one read and right-aligns the short result, which shifts the word down
# by 8 bits per byte missing, and lets the other fail outright as out of bounds.
# Five blocks in the shipped game hit this, including the two scenario_structure_bsp
# tags that would not decode at all. The fork pads those reads on the right instead.
#
# Drop this once the fix lands in a published oozextract release.
# Upstream PR: https://github.com/lvlvllvlvllvlvl/oozextract/pull/3
# Fork branch: https://github.com/devnull9090/oozextract/tree/fix/tail-overread-in-varbits-and-tans
[patch.crates-io]
oozextract = { git = "https://github.com/devnull9090/oozextract", rev = "75fbb3812cc8273f8738eb72623035f0510e3359" }
