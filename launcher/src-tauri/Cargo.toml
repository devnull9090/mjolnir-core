[package]
name = "mjolnir-launcher"
version = "0.1.0"
description = "MJOLNIR Launcher — Mod manager for Halo Campaign Evolved"
authors = ["devnull9090"]
edition = "2021"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
